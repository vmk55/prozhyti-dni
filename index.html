<style>
  :root {
    --ink: #2B2438;
    --ink-2: #3A3148;
    --paper: #FBF6EC;
    --paper-dim: #EFE8D8;
    --gold: #C9A227;
    --gold-dim: #9C8020;
    --teal: #4F7C6B;
    --teal-light: #7FA895;
    --text-on-ink: #EFE7F2;
    --text-muted-on-ink: #A79BB5;
    --text-on-paper: #2B2438;
    --text-muted-on-paper: #6E6580;
    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text-on-ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 18px 60px;
  }

  .page {
    width: 100%;
    max-width: 640px;
  }

  /* ---------- Header / almanac date ---------- */
  .almanac-date {
    text-align: center;
    margin-bottom: 28px;
  }
  .almanac-date .weekday {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .almanac-date .full-date {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 500;
    margin-top: 6px;
    color: var(--text-on-ink);
  }

  /* ---------- Hero day counter ---------- */
  .hero {
    background: var(--paper);
    color: var(--text-on-paper);
    border-radius: 20px;
    padding: 34px 26px;
    text-align: center;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }
  .hero .label {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-muted-on-paper);
    margin-bottom: 10px;
  }
  .hero .days-count {
    font-family: var(--font-mono);
    font-size: clamp(40px, 11vw, 56px);
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero .days-word {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--text-muted-on-paper);
    margin-top: 4px;
  }
  .hero .ymd {
    margin-top: 18px;
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--teal);
  }

  /* ---------- Section title ---------- */
  .section-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 500;
    margin: 36px 0 16px;
    color: var(--text-on-ink);
  }
  .section-title .count {
    color: var(--gold);
  }

  /* ---------- Person card with life-ribbon ---------- */
  .person-card {
    background: var(--paper);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 14px;
    color: var(--text-on-paper);
  }
  .person-name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .person-meta {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-muted-on-paper);
    margin-bottom: 14px;
  }
  .ribbon {
    position: relative;
    height: 8px;
    background: var(--paper-dim);
    border-radius: 4px;
    overflow: visible;
  }
  .ribbon-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--teal);
    border-radius: 4px;
  }
  .ribbon-mark {
    position: absolute;
    top: -5px;
    width: 3px;
    height: 18px;
    background: var(--gold);
    border-radius: 2px;
  }
  .ribbon-caption {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted-on-paper);
    margin-top: 8px;
  }

  /* ---------- Empty / next milestone ---------- */
  .quiet-note {
    background: var(--ink-2);
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    color: var(--text-muted-on-ink);
    font-size: 15px;
    line-height: 1.5;
  }
  .quiet-note strong {
    color: var(--text-on-ink);
    font-family: var(--font-display);
    font-weight: 500;
  }

  /* ---------- Full list rows ---------- */
  .list-row {
    background: var(--paper);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 8px;
    color: var(--text-on-paper);
  }
  .list-row-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
  }
  .list-row-meta {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-muted-on-paper);
    margin-top: 2px;
  }
  .list-row-tag {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .list-row-tag-passed {
    background: rgba(79,124,107,0.15);
    color: var(--teal);
  }
  .list-row-tag-ahead {
    background: rgba(201,162,39,0.15);
    color: var(--gold-dim);
  }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--ink);
    margin-top: 8px;
  }
  .btn-primary:active { background: var(--gold-dim); }
  .btn-text {
    background: none;
    color: var(--text-muted-on-ink);
    font-size: 14px;
    font-weight: 500;
    text-decoration: underline;
    padding: 10px;
  }

  /* ---------- Onboarding ---------- */
  .onboard {
    background: var(--paper);
    border-radius: 20px;
    padding: 30px 26px;
    color: var(--text-on-paper);
    text-align: center;
  }
  .onboard h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .onboard p {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text-muted-on-paper);
    line-height: 1.5;
    margin: 0 0 22px;
  }
  .onboard label {
    display: block;
    font-size: 13px;
    color: var(--text-muted-on-paper);
    text-align: left;
    margin-bottom: 6px;
  }
  .onboard input[type="date"] {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--paper-dim);
    font-family: var(--font-body);
    font-size: 18px;
    color: var(--text-on-paper);
    background: white;
    margin-bottom: 18px;

  /* ---------- Status states ---------- */
  .status {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted-on-ink);
    font-size: 15px;
    line-height: 1.6;
  }
  .status .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--ink-2);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 18px;

  }

    margin-top: 30px;
    text-align: center;
  }

  .error-box {
    background: var(--ink-2);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    color: var(--text-on-ink);
  }
  .error-box p { font-size: 14px; color: var(--text-muted-on-ink); line-height: 1.5; }

  const months = Math.floor(rem / 30);
  const restDays = rem % 30;
  return `${years} СЂ. ${months} РјС–СЃ. ${restDays} РґРЅ.`;

function getPeople() {
  return EMBEDDED_PEOPLE.map(p => {
    const birth = new Date(p.birth);
    const death = new Date(p.death);
    return {
      name: p.name,
      birth: p.birth,
      death: p.death,
      country: p.country,
      lifespanDays: daysBetween(birth, death)
    };
  });
}

function findOutlivedToday(people, targetDays, windowDays = 1) {
  const start = targetDays - windowDays + 1;
  return people
    .filter(p => p.lifespanDays >= start && p.lifespanDays <= targetDays)
    .sort((a,b) => b.lifespanDays - a.lifespanDays);
}

function findNextMilestone(people, targetDays) {
  let best = null;
  for (const p of people) {
    if (p.lifespanDays > targetDays) {
      if (!best || p.lifespanDays < best.lifespanDays) best = p;
    }
  }
  return best;
}

function findUpcoming(people, targetDays, count = 5) {
  return people
    .filter(p => p.lifespanDays > targetDays)
    .sort((a, b) => a.lifespanDays - b.lifespanDays)
    .slice(0, count);
}

/* "РЎСЊРѕРіРѕРґРЅС– вЂ” РІР¶Рµ N СЂ., СЏРє Р’Рё РїРµСЂРµР¶РёР»Рё X."
   Р”Р»СЏ РєРѕР¶РЅРѕС— РІР¶Рµ РїРµСЂРµР¶РёС‚РѕС— Р»СЋРґРёРЅРё С” РєРѕРЅРєСЂРµС‚РЅРёР№ РєР°Р»РµРЅРґР°СЂРЅРёР№ РґРµРЅСЊ, РєРѕР»Рё
   С†Рµ СЃС‚Р°Р»РѕСЃСЏ РІРїРµСЂС€Рµ (РґР°С‚Р° РЅР°СЂРѕРґР¶РµРЅРЅСЏ + С‚СЂРёРІР°Р»С–СЃС‚СЊ С—С— Р¶РёС‚С‚СЏ РІ РґРЅСЏС…).
   Р©РѕСЂРѕРєСѓ РІ С†РµР№ СЃР°РјРёР№ РґРµРЅСЊ (РјС–СЃСЏС†СЊ+С‡РёСЃР»Рѕ) вЂ” СЂС–С‡РЅРёС†СЏ. Р¤СѓРЅРєС†С–СЏ С€СѓРєР°С”,
   С‡Рё СЃСЊРѕРіРѕРґРЅС– (Р· РЅРµРІРµР»РёРєРёРј Р·Р°РїР°СЃРѕРј Сѓ РєС–Р»СЊРєР° РґРЅС–РІ) СЃР°РјРµ С‚Р°РєРёР№ РґРµРЅСЊ,
   С– СЃРєС–Р»СЊРєРё РјРёРЅСѓР»Рѕ РїРѕРІРЅРёС… СЂРѕРєС–РІ РІС–РґС‚РѕРґС–. */
function findAnniversariesToday(people, birthDate, today, windowDays = 2) {
  const results = [];
  const passed = people.filter(p => p.lifespanDays <= (daysBetween(birthDate, today)));

  for (const p of passed) {
    const outliveDate = new Date(birthDate);
    outliveDate.setDate(outliveDate.getDate() + p.lifespanDays);

    const yearsSince = today.getFullYear() - outliveDate.getFullYear();
    if (yearsSince < 1) continue;

    // РџРѕСЂС–РІРЅСЋС”РјРѕ "С†СЊРѕРіРѕСЂС–С‡РЅСѓ" СЂС–С‡РЅРёС†СЋ (С‚РѕР№ СЃР°РјРёР№ РјС–СЃСЏС†СЊ/РґРµРЅСЊ, Р°Р»Рµ РїРѕС‚РѕС‡РЅРѕРіРѕ СЂРѕРєСѓ)
    const thisYearAnniversary = new Date(outliveDate);
    thisYearAnniversary.setFullYear(today.getFullYear());

    const diff = Math.abs(daysBetween(today, thisYearAnniversary));
    if (diff <= windowDays) {
      results.push({ person: p, yearsSince, outliveDate });
    }
  }

  results.sort((a, b) => b.yearsSince - a.yearsSince);
  return results;
}

/* РЇРєС‰Рѕ РЅР° СЃСЊРѕРіРѕРґРЅС– Р¶РѕРґРЅРѕС— СЂС–С‡РЅРёС†С– РЅРµРјР°С” вЂ” С€СѓРєР°С”РјРѕ РЅР°Р№Р±Р»РёР¶С‡Сѓ РјР°Р№Р±СѓС‚РЅСЋ,
   С‰РѕР± Р±Р»РѕРє РЅРµ Р·Р°Р»РёС€Р°РІСЃСЏ РїРѕСЂРѕР¶РЅС–Рј РјС–Р¶ СЂС–С‡РЅРёС†СЏРјРё. */
function findNextAnniversary(people, birthDate, today) {
  const passed = people.filter(p => p.lifespanDays <= (daysBetween(birthDate, today)));
  let best = null;

  for (const p of passed) {
    const outliveDate = new Date(birthDate);
    outliveDate.setDate(outliveDate.getDate() + p.lifespanDays);

    // РќР°СЃС‚СѓРїРЅР° СЂС–С‡РЅРёС†СЏ вЂ” С‚РѕР№ СЃР°РјРёР№ РјС–СЃСЏС†СЊ/РґРµРЅСЊ, Р°Р»Рµ РІ РјР°Р№Р±СѓС‚РЅСЊРѕРјСѓ
    // (С†СЊРѕРіРѕ СЂРѕРєСѓ, СЏРєС‰Рѕ С‰Рµ РЅРµ РјРёРЅСѓР»Р°, С–РЅР°РєС€Рµ РЅР°СЃС‚СѓРїРЅРѕРіРѕ)
    let nextAnniv = new Date(outliveDate);
    nextAnniv.setFullYear(today.getFullYear());
    if (daysBetween(today, nextAnniv) < 0) {
      nextAnniv.setFullYear(today.getFullYear() + 1);
    }

    const daysUntil = daysBetween(today, nextAnniv);
    const yearsSince = nextAnniv.getFullYear() - outliveDate.getFullYear();
    if (yearsSince < 1) continue;

    if (!best || daysUntil < best.daysUntil) {
      best = { person: p, yearsSince, daysUntil };
    }
  }
  return best;
}

/* РўРµРїРµСЂ СЃС‚РѕСЂС–РЅРєР° РјР°С” СЃРїСЂР°РІР¶РЅСЋ Р°РґСЂРµСЃСѓ (https://...), С‚РѕР¶ localStorage
   РїСЂР°С†СЋС” РЅР°РґС–Р№РЅРѕ вЂ” РґР°С‚Сѓ РЅР°СЂРѕРґР¶РµРЅРЅСЏ РґРѕСЃС‚Р°С‚РЅСЊРѕ РІРІРµСЃС‚Рё РѕРґРёРЅ СЂР°Р·. */

function ribbonHtml(person, targetDays) {
  const maxDays = Math.max(person.lifespanDays, targetDays);
  const fillPct = Math.min(100, (person.lifespanDays / maxDays) * 100);
  const markPct = Math.min(100, (targetDays / maxDays) * 100);
  return `
    <div class="person-card">
      <div class="person-name">${person.name}</div>
      <div class="person-meta">${person.country ? person.country + ' В· ' : ''}${person.birth} вЂ” ${person.death} В· РїСЂРѕР¶РёРІ(Р»Р°) ${daysToYMD(person.lifespanDays)}</div>
      <div class="ribbon">
        <div class="ribbon-fill" style="width:${fillPct}%"></div>
        <div class="ribbon-mark" style="left:calc(${markPct}% - 1px)"></div>
      </div>
      <div class="ribbon-caption">
        <span>С—С…РЅС” Р¶РёС‚С‚СЏ</span>
        <span>РІР°С€ СЃСЊРѕРіРѕРґРЅС–С€РЅС–Р№ РґРµРЅСЊ</span>
      </div>
    </div>
  `;
}

      <div class="list-row">
        <div class="list-row-name">${p.name}</div>
        <div class="list-row-meta">${p.country ? p.country + ' В· ' : ''}РїСЂРѕР¶РёРІ(Р»Р°) ${daysToYMD(p.lifespanDays)}</div>
        <div class="list-row-tag list-row-tag-passed">РїРµСЂРµР¶РёС‚Рѕ ${agoDays} ${daysWord(agoDays)} С‚РѕРјСѓ</div>
      </div>
    `;
  }).join("");

  const aheadRows = ahead.map(p => {
    const daysLeft = p.lifespanDays - targetDays;
    return `
      <div class="list-row">
        <div class="list-row-name">${p.name}</div>
        <div class="list-row-meta">${p.country ? p.country + ' В· ' : ''}РїСЂРѕР¶РёРІ(Р»Р°) ${daysToYMD(p.lifespanDays)}</div>
        <div class="list-row-tag list-row-tag-ahead">Р·Р°Р»РёС€РёР»РѕСЃСЊ ${daysLeft} ${daysWord(daysLeft)}</div>
      </div>
    `;
  }).join("");

  render(`
    <div class="almanac-date">
      <div class="weekday">РџРѕРІРЅРёР№ СЃРїРёСЃРѕРє</div>
      <div class="full-date">${passed.length} РїРµСЂРµР¶РёС‚Рѕ В· ${ahead.length} РїРѕРїРµСЂРµРґСѓ</div>
    </div>

    <div class="section-title">Р’Р¶Рµ РїРµСЂРµР¶РёС‚С– <span class="count">(${passed.length})</span></div>
    ${passedRows || '<div class="quiet-note">РџРѕРєРё С‰Рѕ РЅС–РєРѕРіРѕ РЅРµРјР°С” РІ С†СЊРѕРјСѓ СЂРѕР·РґС–Р»С–.</div>'}

    <div class="section-title">РџРѕРїРµСЂРµРґСѓ <span class="count">(${ahead.length})</span></div>
    ${aheadRows || '<div class="quiet-note">РЎРїРёСЃРѕРє С‚СѓС‚ РїРѕСЂРѕР¶РЅС–Р№.</div>'}

    <div class="footer-row">
      <button class="btn-text" id="back-btn">РќР°Р·Р°Рґ</button>
    </div>
  `);

  document.getElementById('back-btn').addEventListener('click', () => {
    showResults(people, birthdateIso);
  });
}

function daysWord(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return "РґРЅС–РІ";
  if (n10 === 1) return "РґРµРЅСЊ";
  if (n10 >= 2 && n10 <= 4) return "РґРЅС–";
  return "РґРЅС–РІ";
}
function dayWordForCount(n) { return daysWord(n); }

function yearsWord(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return "СЂРѕРєС–РІ";
  if (n10 === 1) return "СЂС–Рє";
  if (n10 >= 2 && n10 <= 4) return "СЂРѕРєРё";
  return "СЂРѕРєС–РІ";
}

main();
</script>
