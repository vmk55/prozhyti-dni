<title>Прожиті дні</title>

<style>
  :root {
    --ink: #2B2438;
    --ink-2: #3A3148;
    --paper: #FBF6EC;
    --paper-dim: #EFE8D8;
    --gold: #C9A227;
    --gold-dim: #9C8020;
    --teal: #4F7C6B;
    --teal-light: #7FA895;
    --text-on-ink: #EFE7F2;
    --text-muted-on-ink: #A79BB5;
    --text-on-paper: #2B2438;
    --text-muted-on-paper: #6E6580;
    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text-on-ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 18px 60px;
  }

  .page {
    width: 100%;
    max-width: 640px;
  }

  /* ---------- Header / almanac date ---------- */
  .almanac-date {
    text-align: center;
    margin-bottom: 28px;
  }
  .almanac-date .weekday {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .almanac-date .full-date {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 500;
    margin-top: 6px;
    color: var(--text-on-ink);
  }

  /* ---------- Hero day counter ---------- */
  .hero {
    background: var(--paper);
    color: var(--text-on-paper);
    border-radius: 20px;
    padding: 34px 26px;
    text-align: center;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }
  .hero .label {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-muted-on-paper);
    margin-bottom: 10px;
  }
  .hero .days-count {
    font-family: var(--font-mono);
    font-size: clamp(40px, 11vw, 56px);
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero .days-word {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--text-muted-on-paper);
    margin-top: 4px;
  }
  .hero .ymd {
    margin-top: 18px;
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--teal);
  }

  /* ---------- Section title ---------- */
  .section-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 500;
    margin: 36px 0 16px;
    color: var(--text-on-ink);
  }
  .section-title .count {
    color: var(--gold);
  }

  /* ---------- Person card with life-ribbon ---------- */
  .person-card {
    background: var(--paper);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 14px;
    color: var(--text-on-paper);
  }
  .person-name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .person-meta {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-muted-on-paper);
    margin-bottom: 14px;
  }
  .ribbon {
    position: relative;
    height: 8px;
    background: var(--paper-dim);
    border-radius: 4px;
    overflow: visible;
  }
  .ribbon-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--teal);
    border-radius: 4px;
  }
  .ribbon-mark {
    position: absolute;
    top: -5px;
    width: 3px;
    height: 18px;
    background: var(--gold);
    border-radius: 2px;
  }
  .ribbon-caption {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted-on-paper);
    margin-top: 8px;
  }

  /* ---------- Empty / next milestone ---------- */
  .quiet-note {
    background: var(--ink-2);
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    color: var(--text-muted-on-ink);
    font-size: 15px;
    line-height: 1.5;
  }
  .quiet-note strong {
    color: var(--text-on-ink);
    font-family: var(--font-display);
    font-weight: 500;
  }

  /* ---------- Full list rows ---------- */
  .list-row {
    background: var(--paper);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 8px;
    color: var(--text-on-paper);
  }
  .list-row-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
  }
  .list-row-meta {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-muted-on-paper);
    margin-top: 2px;
  }
  .list-row-tag {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .list-row-tag-passed {
    background: rgba(79,124,107,0.15);
    color: var(--teal);
  }
  .list-row-tag-ahead {
    background: rgba(201,162,39,0.15);
    color: var(--gold-dim);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--ink);
    margin-top: 8px;
  }
  .btn-primary:active { background: var(--gold-dim); }
  .btn-text {
    background: none;
    color: var(--text-muted-on-ink);
    font-size: 14px;
    font-weight: 500;
    text-decoration: underline;
    padding: 10px;
  }

  /* ---------- Onboarding ---------- */
  .onboard {
    background: var(--paper);
    border-radius: 20px;
    padding: 30px 26px;
    color: var(--text-on-paper);
    text-align: center;
  }
  .onboard h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .onboard p {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text-muted-on-paper);
    line-height: 1.5;
    margin: 0 0 22px;
  }
  .onboard label {
    display: block;
    font-size: 13px;
    color: var(--text-muted-on-paper);
    text-align: left;
    margin-bottom: 6px;
  }
  .onboard input[type="date"] {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--paper-dim);
    font-family: var(--font-body);
    font-size: 18px;
    color: var(--text-on-paper);
    background: white;
    margin-bottom: 18px;
  }

  /* ---------- Status states ---------- */
  .status {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted-on-ink);
    font-size: 15px;
    line-height: 1.6;
  }
  .status .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--ink-2);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-row {
    margin-top: 30px;
    text-align: center;
  }

  .error-box {
    background: var(--ink-2);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    color: var(--text-on-ink);
  }
  .error-box p { font-size: 14px; color: var(--text-muted-on-ink); line-height: 1.5; }
</style>
</head>

const UK_MONTHS = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const UK_WEEKDAYS = ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];

const WORLD_MIN_SITELINKS = 30;

function todayDate() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function daysBetween(a, b) {
  const MS = 24 * 60 * 60 * 1000;
  return Math.round((b - a) / MS);
}

function daysToYMD(days) {
  const years = Math.floor(days / 365);
  const rem = days % 365;
  const months = Math.floor(rem / 30);
  const restDays = rem % 30;
  return `${years} р. ${months} міс. ${restDays} дн.`;
}

function formatFullDate(d) {
  return `${d.getDate()} ${UK_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

const app = document.getElementById('app');

function render(html) {
  app.innerHTML = html;
}

function renderStatus(text) {
  render(`
    <div class="status">
      <div class="spinner"></div>
      <div>${text}</div>
    </div>
  `);
}

function renderError(message, onRetryId) {
  render(`
    <div class="error-box">
      <div style="font-family: var(--font-display); font-size:20px; margin-bottom:10px;">Не вдалося завантажити дані</div>
      <p>${message}</p>
      <button class="btn btn-primary" id="${onRetryId}" style="margin-top:16px;">Спробувати ще раз</button>
    </div>
  `);
}

function getPeople() {
  return EMBEDDED_PEOPLE.map(p => {
    const birth = new Date(p.birth);
    const death = new Date(p.death);
    return {
      name: p.name,
      birth: p.birth,
      death: p.death,
      country: p.country,
      lifespanDays: daysBetween(birth, death)
    };
  });
}

function findOutlivedToday(people, targetDays, windowDays = 1) {
  const start = targetDays - windowDays + 1;
  return people
    .filter(p => p.lifespanDays >= start && p.lifespanDays <= targetDays)
    .sort((a,b) => b.lifespanDays - a.lifespanDays);
}

function findNextMilestone(people, targetDays) {
  let best = null;
  for (const p of people) {
    if (p.lifespanDays > targetDays) {
      if (!best || p.lifespanDays < best.lifespanDays) best = p;
    }
  }
  return best;
}

function findUpcoming(people, targetDays, count = 5) {
  return people
    .filter(p => p.lifespanDays > targetDays)
    .sort((a, b) => a.lifespanDays - b.lifespanDays)
    .slice(0, count);
}

/* "Сьогодні — вже N р., як Ви пережили X."
   Для кожної вже пережитої людини є конкретний календарний день, коли
   це сталося вперше (дата народження + тривалість її життя в днях).
   Щороку в цей самий день (місяць+число) — річниця. Функція шукає,
   чи сьогодні (з невеликим запасом у кілька днів) саме такий день,
   і скільки минуло повних років відтоді. */
function findAnniversariesToday(people, birthDate, today, windowDays = 2) {
  const results = [];
  const passed = people.filter(p => p.lifespanDays <= (daysBetween(birthDate, today)));

  for (const p of passed) {
    const outliveDate = new Date(birthDate);
    outliveDate.setDate(outliveDate.getDate() + p.lifespanDays);

    const yearsSince = today.getFullYear() - outliveDate.getFullYear();
    if (yearsSince < 1) continue;

    // Порівнюємо "цьогорічну" річницю (той самий місяць/день, але поточного року)
    const thisYearAnniversary = new Date(outliveDate);
    thisYearAnniversary.setFullYear(today.getFullYear());

    const diff = Math.abs(daysBetween(today, thisYearAnniversary));
    if (diff <= windowDays) {
      results.push({ person: p, yearsSince, outliveDate });
    }
  }

  results.sort((a, b) => b.yearsSince - a.yearsSince);
  return results;
}

/* Тепер сторінка має справжню адресу (https://...), тож localStorage
   працює надійно — дату народження достатньо ввести один раз. */
function getSavedBirthdate() {
  try {
    return localStorage.getItem('outlived_birthdate');
  } catch (e) {
    return null;
  }
}
function saveBirthdate(iso) {
  try {
    localStorage.setItem('outlived_birthdate', iso);
  } catch (e) { /* якщо не вийшло — просто попросимо ввести знову наступного разу */ }
}
function clearSavedBirthdate() {
  try {
    localStorage.removeItem('outlived_birthdate');
  } catch (e) {}
}

function renderOnboarding() {
  render(`
    <div class="onboard">
      <h1>Прожиті дні</h1>
      <p>Щодня ця сторінка показуватиме, кого з видатних людей України та світу ви саме сьогодні пережили.</p>
      <label for="bd-input">Ваша дата народження</label>
      <input type="date" id="bd-input" max="${new Date().toISOString().slice(0,10)}">
      <button class="btn btn-primary" id="bd-submit">Почати</button>
    </div>
  `);
  document.getElementById('bd-submit').addEventListener('click', () => {
    const val = document.getElementById('bd-input').value;
    if (!val) return;
    currentBirthdate = val;
    saveBirthdate(val);
    loadAndShow(val);
  });
}

function ribbonHtml(person, targetDays) {
  const maxDays = Math.max(person.lifespanDays, targetDays);
  const fillPct = Math.min(100, (person.lifespanDays / maxDays) * 100);
  const markPct = Math.min(100, (targetDays / maxDays) * 100);
  return `
    <div class="person-card">
      <div class="person-name">${person.name}</div>
      <div class="person-meta">${person.country ? person.country + ' · ' : ''}${person.birth} — ${person.death} · прожив(ла) ${daysToYMD(person.lifespanDays)}</div>
      <div class="ribbon">
        <div class="ribbon-fill" style="width:${fillPct}%"></div>
        <div class="ribbon-mark" style="left:calc(${markPct}% - 1px)"></div>
      </div>
      <div class="ribbon-caption">
        <span>їхнє життя</span>
        <span>ваш сьогоднішній день</span>
      </div>
    </div>
  `;
}

function loadAndShow(birthdateIso) {
  const people = getPeople();
  showResults(people, birthdateIso);
}

function main() {
  const saved = getSavedBirthdate();
  if (saved) {
    currentBirthdate = saved;
    loadAndShow(saved);
  } else {
    renderOnboarding();
  }
}

function showResults(people, birthdateIso) {
  const birth = new Date(birthdateIso);
  const today = todayDate();
  const targetDays = daysBetween(birth, today);
  const matches = findOutlivedToday(people, targetDays, 14);

  const weekday = UK_WEEKDAYS[today.getDay()];
  const dateStr = formatFullDate(today);

  let body = "";
  if (matches.length > 0) {
    body += `<div class="section-title">Нещодавно ви пережили <span class="count">(${matches.length})</span></div>`;
    body += matches.map(p => ribbonHtml(p, targetDays)).join("");
  } else {
    body += `<div class="quiet-note">Сьогодні без нових імен.</div>`;
  }

  const anniversaries = findAnniversariesToday(people, birth, today, 2);
  if (anniversaries.length > 0) {
    body += `<div class="section-title">Річниці сьогодні</div>`;
    body += anniversaries.map(a => `
      <div class="quiet-note" style="text-align:left; margin-bottom:10px;">
        Сьогодні — вже <strong>${a.yearsSince} ${yearsWord(a.yearsSince)}</strong>, як Ви пережили <strong>${a.person.name}</strong>.
      </div>
    `).join("");
  }

  const upcoming = findUpcoming(people, targetDays, 5);
  if (upcoming.length > 0) {
    body += `<div class="section-title">Наступним стане</div>`;
    body += upcoming.map((p, i) => {
      const daysLeft = p.lifespanDays - targetDays;
      const isNext = i === 0;
      return `
        <div class="list-row" style="${isNext ? 'border: 2px solid var(--gold);' : ''}">
          <div class="list-row-name">${p.name}</div>
          <div class="list-row-meta">${p.country ? p.country + ' · ' : ''}прожив(ла) ${daysToYMD(p.lifespanDays)}</div>
          <span class="list-row-tag list-row-tag-ahead">за ${daysLeft} ${daysWord(daysLeft)}</span>
        </div>
      `;
    }).join("");
  }

  render(`
    <div class="almanac-date">
      <div class="weekday">${weekday}</div>
      <div class="full-date">${dateStr}</div>
    </div>
    <div class="hero">
      <div class="label">Ви живете вже</div>
      <div class="days-count">${targetDays.toLocaleString('uk-UA')}</div>
      <div class="days-word">${dayWordForCount(targetDays)}</div>
      <div class="ymd">${daysToYMD(targetDays)}</div>
    </div>
    ${body}
    <div class="footer-row">
      <button class="btn btn-primary" id="full-list-btn" style="background: var(--teal); color: var(--text-on-ink); margin-bottom:10px;">Переглянути весь список</button>
      <button class="btn-text" id="reset-btn">Ввести іншу дату народження</button>
    </div>
  `);

  document.getElementById('reset-btn').addEventListener('click', () => {
    clearSavedBirthdate();
    renderOnboarding();
  });
  document.getElementById('full-list-btn').addEventListener('click', () => {
    renderFullList(people, targetDays, birthdateIso);
  });
}

function renderFullList(people, targetDays, birthdateIso) {
  const passed = people
    .filter(p => p.lifespanDays <= targetDays)
    .sort((a,b) => b.lifespanDays - a.lifespanDays); // найдовгожителі — перші

  const ahead = people
    .filter(p => p.lifespanDays > targetDays)
    .sort((a,b) => a.lifespanDays - b.lifespanDays); // найближчі — перші

  const passedRows = passed.map(p => {
    const agoDays = targetDays - p.lifespanDays;
    return `
      <div class="list-row">
        <div class="list-row-name">${p.name}</div>
        <div class="list-row-meta">${p.country ? p.country + ' · ' : ''}прожив(ла) ${daysToYMD(p.lifespanDays)}</div>
        <div class="list-row-tag list-row-tag-passed">пережито ${agoDays} ${daysWord(agoDays)} тому</div>
      </div>
    `;
  }).join("");

  const aheadRows = ahead.map(p => {
    const daysLeft = p.lifespanDays - targetDays;
    return `
      <div class="list-row">
        <div class="list-row-name">${p.name}</div>
        <div class="list-row-meta">${p.country ? p.country + ' · ' : ''}прожив(ла) ${daysToYMD(p.lifespanDays)}</div>
        <div class="list-row-tag list-row-tag-ahead">залишилось ${daysLeft} ${daysWord(daysLeft)}</div>
      </div>
    `;
  }).join("");

  render(`
    <div class="almanac-date">
      <div class="weekday">Повний список</div>
      <div class="full-date">${passed.length} пережито · ${ahead.length} попереду</div>
    </div>

    <div class="section-title">Вже пережиті <span class="count">(${passed.length})</span></div>
    ${passedRows || '<div class="quiet-note">Поки що нікого немає в цьому розділі.</div>'}

    <div class="section-title">Попереду <span class="count">(${ahead.length})</span></div>
    ${aheadRows || '<div class="quiet-note">Список тут порожній.</div>'}

    <div class="footer-row">
      <button class="btn-text" id="back-btn">Назад</button>
    </div>
  `);

  document.getElementById('back-btn').addEventListener('click', () => {
    showResults(people, birthdateIso);
  });
}

function daysWord(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return "днів";
  if (n10 === 1) return "день";
  if (n10 >= 2 && n10 <= 4) return "дні";
  return "днів";
}
function dayWordForCount(n) { return daysWord(n); }

function yearsWord(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return "років";
  if (n10 === 1) return "рік";
  if (n10 >= 2 && n10 <= 4) return "роки";
  return "років";
}
